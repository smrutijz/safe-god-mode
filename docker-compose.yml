services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: docker.io/smrutijz/safe-god-mode:latest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /home/smrut/.claude:/home/agent/.claude:ro
      - /home/smrut/.claude.json:/home/agent/.claude.json:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    image: docker.io/smrutijz/safe-god-mode:latest
    command: celery -A src.core.celery_app worker --loglevel=info
    volumes:
      - /home/smrut/.claude:/home/agent/.claude:ro
      - /home/smrut/.claude.json:/home/agent/.claude.json:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
