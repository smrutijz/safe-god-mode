services:
  api:
    image: docker.io/smrutijz/safe-god-mode:latest
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      # gcloud credentials for IAP tunnel + Compute API access (when running outside GCP)
      # Must be read-write so gcloud can refresh access tokens
      # When running ON a GCE instance, remove this — the instance SA is used automatically
      - /home/smrut/.config/gcloud:/home/app/.config/gcloud:rw
    restart: unless-stopped
